<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Shopping Bill Calculator</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
}
.main-container {
background: #ffffff;
padding: 30px;
border-radius: 15px;
box-shadow: 0 10px 25px rgba(0,0,0,0.1);
width: 500px;
border-top: 5px solid #ff9966;
}
h2 {
text-align: center;
color: #333;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
color: #555;
font-weight: 600;
}
input {
width: 100%;
padding: 10px;
border: 2px solid #ddd;
border-radius: 8px;
box-sizing: border-box;
transition: border-color 0.3s;
}
input:focus {
border-color: #ff9966;
outline: none;
}
.btn-calc {
width: 100%;
padding: 12px;
background: linear-gradient(to right, #ff9966, #ff5e62);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
margin-top: 10px;
font-weight: bold;
}
.btn-calc:hover {
background: linear-gradient(to right, #ff5e62, #ff9966);
}
.popup-overlay {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.6);
justify-content: center;
align-items: center;
z-index: 1000;
}
.popup-content {
background: #fff;
padding: 25px;
border-radius: 12px;
width: 400px;
position: relative;
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
border-left: 10px solid #28a745;
}
.close-btn {
position: absolute;
top: 10px;
right: 15px;
font-size: 24px;
cursor: pointer;
color: #aaa;
}
.close-btn:hover {
color: #333;
}
.receipt-header {
text-align: center;
border-bottom: 2px dashed #ccc;
padding-bottom: 10px;
margin-bottom: 10px;
}
.receipt-row {
display: flex;
justify-content: space-between;
margin-bottom: 8px;
font-size: 14px;
}
.receipt-total {
border-top: 2px dashed #ccc;
padding-top: 10px;
margin-top: 10px;
font-weight: bold;
font-size: 18px;
color: #28a745;
}
.highlight {
color: #ff5e62;
font-weight: bold;
}
.footer-credit {
position: fixed;
bottom: 10px;
right: 15px;
font-family: 'Segoe UI', sans-serif;
font-size: 14px;
color: #555;
text-align: right;
background: rgba(255, 255, 255, 0.8);
padding: 5px 10px;
border-radius: 5px;
border: 1px solid #ddd;
z-index: 1000;
}
</style>
</head>
<body>
<div class="main-container">
<h2>Caramel Mart Bill Calculator</h2>
<div class="form-group">
<label>Customer Name</label>
<input type="text" id="custName" placeholder="Enter name">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="custPhone" placeholder="Enter mobile number">
</div>
<div class="form-group">
<label>Product Name</label>
<input type="text" id="prodName" placeholder="Item name">
</div>
<div class="form-group">
<label>Price per Unit (₹)</label>
<input type="number" id="prodPrice" placeholder="0.00" min="0" step="0.01">
</div>
<div class="form-group">
<label>Quantity</label>
<input type="number" id="prodQty" placeholder="1" min="1">
</div>
<div class="form-group">
<label>GST Rate (%)</label>
<input type="number" id="gstRate" value="18" min="0">
</div>
<button class="btn-calc" onclick="generateBill()">Generate Bill</button>
</div>

<div class="popup-overlay" id="receiptPopup">
<div class="popup-content">
<span class="close-btn" onclick="closePopup()">&times;</span>
<div class="receipt-header">
<h3 style="margin:0; color:#333;">INVOICE RECEIPT</h3>
<p style="margin:5px 0 0; color:#777; font-size:12px;">Thank you for shopping!</p>
</div>
<div id="receiptBody"></div>
<div class="receipt-total" id="receiptFooter"></div>
<button class="btn-calc" style="margin-top: 15px; background:#333;" onclick="closePopup()">Close</button>
</div>
</div>

<div class="footer-credit">
Designed by M Hussain Khan<br>
PRN 25070521505 SEC A batch 2024-2028
</div>

<script>
function generateBill() {
const name = document.getElementById('custName').value || 'Guest Customer';
const phone = document.getElementById('custPhone').value || 'N/A';
const product = document.getElementById('prodName').value || 'Unknown Item';
const price = parseFloat(document.getElementById('prodPrice').value) || 0;
const qty = parseFloat(document.getElementById('prodQty').value) || 0;
const gstRate = parseFloat(document.getElementById('gstRate').value) || 0;

const subtotal = price * qty;
const gstAmount = subtotal * (gstRate / 100);
const total = subtotal + gstAmount;

const receiptHTML = `
<div class="receipt-row"><span><strong>Customer:</strong></span> <span class="highlight">${name}</span></div>
<div class="receipt-row"><span><strong>Phone:</strong></span> <span>${phone}</span></div>
<div class="receipt-row"><span><strong>Product:</strong></span> <span>${product}</span></div>
<div class="receipt-row"><span><strong>Price:</strong></span> <span>₹${price.toFixed(2)}</span></div>
<div class="receipt-row"><span><strong>Quantity:</strong></span> <span>${qty}</span></div>
<div class="receipt-row"><span><strong>Subtotal:</strong></span> <span>₹${subtotal.toFixed(2)}</span></div>
<div class="receipt-row"><span><strong>GST (${gstRate}%):</strong></span> <span>₹${gstAmount.toFixed(2)}</span></div>
`;

const footerHTML = `
<div class="receipt-row" style="font-size:18px;">
<span>TOTAL PAYABLE:</span>
<span>₹${total.toFixed(2)}</span>
</div>
`;

document.getElementById('receiptBody').innerHTML = receiptHTML;
document.getElementById('receiptFooter').innerHTML = footerHTML;
document.getElementById('receiptPopup').style.display = 'flex';
}

function closePopup() {
document.getElementById('receiptPopup').style.display = 'none';
}
</script>
</body>
</html>
