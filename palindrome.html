<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Palindrome Checker</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 200px; margin-right: 10px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Palindrome Checker</h2>
        <input type="text" id="text-input" placeholder="Enter text...">
        <button onclick="checkPalindrome()">Check</button>
        <div id="result"></div>
    </div>

    <script>
        function checkPalindrome() {
            const input = document.getElementById('text-input').value;
            const cleaned = input.toLowerCase().replace(/[^a-z0-9]/g, '');
            const reversed = cleaned.split('').reverse().join('');
            const resultDiv = document.getElementById('result');
            
            if (!cleaned) {
                resultDiv.textContent = 'Please enter text.';
                resultDiv.style.color = 'black';
                return;
            }
            
            if (cleaned === reversed) {
                resultDiv.textContent = `"${input}" is a palindrome!`;
                resultDiv.style.color = 'green';
            } else {
                resultDiv.textContent = `"${input}" is not a palindrome.`;
                resultDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
